name: Deploy Web Page via SFTP (WinSCP Protocol)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-sftp:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch repository code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Upload files to the remote server using SFTP
      - name: SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          # Port is typically 22 for SSH/SFTP
          port: 22
          # Local folder in your repository to copy from ('.' means root)
          localDir: '.'
          # Remote server directory (where WinSCP would upload files)
          remoteDir: ${{ secrets.REMOTE_TARGET }}